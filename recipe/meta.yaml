#
# See the guidelines for updating this recipe for new releases:
# https://github.com/scrapy/scrapy/wiki/Scrapy-release-procedure#conda-packages
#
{% set name = "Scrapy" %}
{% set version = "2.20.0" %}
{% set sha256 = "27af677573787a15800332f1998b3e05c48eb06f0e02c1702542e71ccd327b1a" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | lower }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  number: 0
  noarch: python
  entry_points:
    - scrapy = scrapy.cmdline:execute

# The requirements below shall match the requirements from the target package
# version (check pyproject.toml for changes).
requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling

  run:
    - python >={{ python_min }}
    # pywin32 exists for unix as a noop package
    - pywin32

    # Same order as pyproject.toml:
    - pydispatcher >=2.0.5
    - twisted >=23.10.0
    - aiodns >=3.3.0
    - aioftp >=0.26.1
    - aiohttp >=3.13.3
    # On Python 3.14 and higher the standard library compression.zstd module is
    # used instead, but a noarch package cannot require this conditionally.
    - backports.zstd >=1.3.0
    - brotli-python >=1.2.0
    - cryptography >=41.0.5
    - cssselect >=1.2.0
    - defusedxml >=0.7.1
    - formerly >=0.1.0
    - frostwork >=0.2.2
    - itemadapter >=0.1.0
    - itemloaders >=1.0.5
    - lxml >=4.9.4
    - packaging
    - parsel >=1.8.1
    - platformdirs >=2.0.0
    - protego >=0.2.0
    - pyOpenSSL >=24.3.0
    - queuelib >=1.8.0
    - service_identity >=24.2.0
    - tldextract
    # Only needed before Python 3.13, but a noarch package cannot require this
    # conditionally.
    - typing-extensions >=4.13.0
    - w3lib >=2.6.0
    - zope.interface >=5.1.0

test:
  requires:
    - python {{ python_min }}
    - attrs
    - botocore
    - bpython  # [not win]
    - httpx2
    - ipython
    - google-cloud-storage
    - pip
    - jmespath
    - pexpect
    - pillow
    - ptpython
    - pyftpdlib
    - pytest >=8.4.1
    - pytest-rerunfailures
    - pytest-twisted
    - priority >=1.1.0,<2.0
    - sybil
    - setuptools-scm   # required indirectly by pytest-forked
  source_files:
    - conftest.py
    - pyproject.toml
    - scrapy
    - tests
  commands:
    - scrapy version -v
    - mv scrapy _scrapy
    # Scrapy's pyproject.toml turns warnings into errors for environments that
    # match its own tested dependency versions; -W default opts this
    # environment out, the same way Scrapy's tox.ini does for its own envs
    # with different pinned dependencies.
    # The CI image sets REQUESTS_CA_BUNDLE to an empty string, which recent
    # botocore releases reject outright when creating an S3 client.
    - unset REQUESTS_CA_BUNDLE && pytest _scrapy tests -W default

about:
  home: https://scrapy.org/
  license: BSD-3-Clause-Clear
  license_file: LICENSE
  summary: A high-level Python Screen Scraping framework
  description: |
    Scrapy is an open source and collaborative framework for extracting the
    data you need from websites in a fast, simple, yet extensible way.
  doc_url: https://docs.scrapy.org
  dev_url: https://github.com/scrapy/scrapy

extra:
  recipe-maintainers:
    - rmax
    - kmike
    - Gallaecio
    - wRAR
    - dangra
    - AdrianAtZyte
